# Habblaud no Docker local.
#
# Suba com `npm run docker:up`: o script detecta as contas do Claude Code no host e gera o
# docker-compose.override.yml (fora do controle de versão) com:
#   - montagens SOMENTE LEITURA de <conta>/projects e <conta>/sessions em /claude/<conta>/...
#     (nunca a pasta inteira da conta: lá ficam credenciais e configurações) e de ~/.habblaud/usage
#     (uso de 5h/semanal capturado pelo tap de statusline) em /usage;
#   - do Codex, SOMENTE <pasta>/sessions, <pasta>/archived_sessions e <pasta>/thread-writer-locks em
#     /codex/<conta>/... (nunca auth.json, config.toml, history.jsonl, logs nem os bancos SQLite);
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_CODEX_DIRS, HABBLAUD_ACCOUNTS e HABBLAUD_USAGE_DIR.
# O Compose mescla o override automaticamente em qualquer `docker compose ...` rodado nesta pasta.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # Os transcripts são sensíveis: por padrão a porta é publicada SÓ na interface local do host
    # (HABBLAUD_BIND=0.0.0.0 no .env libera a rede local; veja o README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
      # A porta do acesso pelo celular (com login) só é publicada depois do npm run remote:setup: quem a junta é o
      # docker-compose.override.yml que o docker:up gera.
    volumes:
      - habblaud-data:/data
    # Opções que podem vir do .env (ou do ambiente) para dentro do container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # O mesmo valor da porta publicada acima: o terminal (e o que age sobre as sessões) só liga com bind local.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      # 0 desliga as mensagens pelo escritório (mandar mensagens aos agentes pela página e pelo terminal).
      HABBLAUD_MENSAGENS: ${HABBLAUD_MENSAGENS:-}
      # 0 desliga a verificação de versão nova (consulta às releases no GitHub a cada 6 h).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      # 0 desliga as sessões do Codex no escritório.
      HABBLAUD_CODEX: ${HABBLAUD_CODEX:-}
      # 1 liga o Novo agente pelo escritório (no Docker, quem começa a sessão é o auxiliar do host, npm run
      # codex:bridge; o terminal interativo em si não roda no container).
      HABBLAUD_PTY: ${HABBLAUD_PTY:-}
      # 1 liga o login por pessoa (server/auth/): usuários com senha; o primeiro acesso cria o administrador.
      HABBLAUD_LOGIN: ${HABBLAUD_LOGIN:-}
      # 1 marca o cookie de sessão como Secure (com HTTPS na frente, no deploy).
      HABBLAUD_LOGIN_SECURE_COOKIE: ${HABBLAUD_LOGIN_SECURE_COOKIE:-}
      # Memória (serviço ai-memory abaixo; server/memory/ai-memory.ts): o docker:up preenche os dois quando ela está
      # ligada (HABBLAUD_AI_MEMORY=0 no .env desliga).
      HABBLAUD_AI_MEMORY_URL: ${HABBLAUD_AI_MEMORY_URL:-}
      HABBLAUD_AI_MEMORY_TOKEN: ${HABBLAUD_AI_MEMORY_TOKEN:-}
      # Acesso remoto com login (server/http/remote.ts).
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:-}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:-}
      HABBLAUD_REMOTE_ALLOW: ${HABBLAUD_REMOTE_ALLOW:-}
      HABBLAUD_REMOTE_INSECURE_HTTP: ${HABBLAUD_REMOTE_INSECURE_HTTP:-}
    # Endurecimento: sistema de arquivos só leitura (exceto /data e /tmp), sem capabilities extras.
    read_only: true
    # /tmp em memória, com teto: sem `size` o Docker deixa usar metade da RAM do host.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true

  # Memória do projeto (github.com/akitaonrails/ai-memory, MIT): wiki em markdown versionada em git + índice SQLite.
  # Os hooks e o MCP das contas (npm run memory:install) gravam aqui o que cada sessão faz; o Habblaud publica cada
  # pedido concluído. A memória é do projeto, não da conta do Claude: outra conta ou outra ferramenta continua de onde
  # parou. Só sobe com o perfil "memoria" (o docker:up liga), com versão fixa e token (scripts/memory.ts).
  ai-memory:
    image: akitaonrails/ai-memory:3.1.0
    container_name: ai-memory
    profiles: ["memoria"]
    restart: unless-stopped
    # Só o próprio computador alcança (hooks e MCP das contas); o Habblaud fala pela rede do Compose.
    ports:
      - "127.0.0.1:49374:49374"
    volumes:
      - ai-memory-data:/data
    environment:
      AI_MEMORY_AUTH_TOKEN: ${HABBLAUD_AI_MEMORY_TOKEN:-}
      # Nomes aceitos no Host: o loopback (hooks), o Docker Desktop e o nome do serviço (o Habblaud).
      AI_MEMORY_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,host.docker.internal,ai-memory"
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  habblaud-data:
  # Nome fixo: o mesmo volume de quem já usava o ai-memory num container avulso.
  ai-memory-data:
    name: ai-memory-data
